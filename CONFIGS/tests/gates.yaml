separation:
  silhouette_min: 0.35
  mean_jsd_min: 0.10
  ari_min: 0.80

guard:
  max_tokens: 20
  banned_terms:
    - "sorry"
    - "I can't"
    - "unclear"
    - "unsure"
  numeric_audit:
    allow_hallucinated_numbers: false
    require_context_grounding: true
  fallback_reason: "Decision based on available context."
