# Unsupervised Dynamic Persona Discovery Configuration
# Phase 3E.3 Revised: Discover personas from data without fixed mappings

# Global settings
seed: 17
deterministic: true
device: auto  # auto, cpu, cuda, mps

# Persona source selection
persona_source: curated  # curated | discovered | hybrid
use_discovered_personas: false  # Feature flag for router

# Session aggregation
aggregation:
  # Aggregate step embeddings to session level
  method: mean  # mean, last, max, attention_weighted
  min_steps_per_session: 2
  keep_rationales: true  # Keep rationale text for labeling
  keep_facts: true  # Keep fact aggregates for labeling

# Embedding source
embeddings:
  # Input: step-level embeddings from encoder
  step_embeddings_path: artifacts/encoder/embeddings.parquet
  # Output: session-level embeddings
  session_embeddings_path: artifacts/encoder/session_embeddings.parquet
  dim: 256

# k-NN Graph Construction
graph:
  # Number of nearest neighbors (range: 15-30)
  k: 20
  # Similarity metric
  metric: cosine
  # Drop edges below this threshold
  min_similarity: 0.35
  # Use approximate nearest neighbors for speed (FAISS)
  use_approximate: true
  # FAISS index type
  faiss_index_type: IndexFlatIP  # Inner product for normalized vectors
  # Output directory
  output_dir: artifacts/discovery/graph

# Primary clustering (HDBSCAN)
clustering:
  algorithm: hdbscan  # Primary algorithm

  hdbscan:
    # Minimum cluster size (absolute count)
    min_cluster_size: 15
    # Minimum samples for core points
    min_samples: 8
    # Cluster selection method
    cluster_selection_method: eom  # excess of mass
    # Epsilon for cluster selection
    cluster_selection_epsilon: 0.0
    # Metric (use precomputed from graph)
    metric: euclidean  # Will use embeddings directly
    # Alpha for distance scaling
    alpha: 1.0
    # Export soft memberships
    soft_memberships: true
    # Export probabilities
    export_probabilities: true

  # Output
  output_dir: artifacts/discovery/labels

# Bootstrap Stability
stability:
  # Number of bootstrap iterations
  n_bootstrap: 20
  # Sampling method
  sampling_method: replacement  # replacement | stratified
  # Sample fraction (ignored for replacement)
  sample_frac: 0.8
  # Stability metric
  metric: jaccard  # jaccard | ari
  # Minimum stability threshold for stable cores
  min_stability: 0.75
  # Per-cluster stability threshold
  min_cluster_stability: 0.70
  # Output
  output_dir: artifacts/discovery/stability

# Leiden Fallback
leiden:
  # Trigger thresholds
  triggers:
    # Run if noise fraction exceeds this
    max_noise_frac: 0.20
    # Run if too many clusters
    max_n_clusters: 40
    # Run if silhouette too low
    min_silhouette: 0.30

  # Resolution sweep
  resolution_range: [0.5, 0.8, 1.0, 1.2, 1.5]
  # Number of iterations per resolution
  n_iterations: 10
  # Selection criteria (weighted combination)
  selection_criteria:
    silhouette_weight: 0.6
    modularity_weight: 0.4

  # Output
  output_dir: artifacts/discovery/labels_leiden

# Auto-resolution (merge/filter)
auto_resolve:
  enabled: true

  # Merge near-duplicate clusters
  merge:
    enabled: true
    # Cosine distance threshold for centroids
    centroid_distance_threshold: 0.10
    # Label term overlap threshold (Jaccard)
    label_overlap_threshold: 0.40
    # Require both conditions
    require_both: true

  # Drop small or unstable clusters
  filter:
    enabled: true
    # Minimum cluster size as fraction of total sessions
    min_size_frac: 0.005  # 0.5%
    # Minimum cluster size as absolute count
    min_size_abs: 10
    # Allow niche clusters (small but highly stable)
    allow_niche: true
    # Niche stability threshold (higher than general)
    niche_stability_threshold: 0.85

  # Maximum cluster size (prevent dominance)
  max_size_frac: 0.40  # 40%

  # Recompute metrics after changes
  recompute_metrics: true

# Unsupervised Labeling
labeling:
  # Text sources
  sources: [rationales, facts]  # Which aggregates to use

  # Tokenization
  tokenizer:
    lowercase: true
    remove_stopwords: true
    stopwords_lang: english
    min_token_length: 3
    max_token_length: 20

  # N-gram extraction
  ngrams:
    min_n: 1
    max_n: 3
    min_df: 2  # Minimum document frequency
    max_df: 0.8  # Maximum document frequency (fraction)

  # TF-IDF
  tfidf:
    use_idf: true
    smooth_idf: true
    sublinear_tf: true
    max_features: 500

  # Dimensionality reduction
  svd:
    n_components: 50
    n_iter: 10

  # Label generation
  labels:
    # Top-k terms per cluster
    top_k_terms: 10
    # Label template (uses top terms)
    max_label_length: 40
    # Description length
    description_sentences: 2

  # Output
  output_path: artifacts/discovery/labels_text.json

# Metrics and Gates
metrics:
  # Clustering quality
  clustering_quality:
    silhouette:
      enabled: true
      min_score: 0.45
    davies_bouldin:
      enabled: true
      max_score: 0.8
    calinski_harabasz:
      enabled: true
      min_score: 100.0

  # Distribution quality
  distribution:
    enabled: true
    # Maximum Gini coefficient (concentration)
    max_gini: 0.60
    # Minimum entropy (bits)
    min_entropy: 2.5

  # Distinctiveness
  distinct_n:
    enabled: true
    n: 3  # Trigrams
    # Minimum margin vs nearest neighbor
    min_margin: 0.10
    # Number of test prompts per cluster
    n_probes: 20

  # Psychometric consistency
  psychometric:
    enabled: true
    # Big Five traits to check
    traits: [O, C, E, A, N]
    # Minimum number of consistent traits
    min_consistent_traits: 4
    # Within-cluster consistency threshold
    consistency_threshold: 0.15  # Max std dev

  # Size limits
  size_limits:
    enabled: true
    min_cluster_size_frac: 0.005
    max_cluster_size_frac: 0.40

  # Output
  output_path: artifacts/discovery/metrics.json

# Persona Synthesis
synthesis:
  # Schema version to generate
  schema_version: "mvp_v1_discovered"

  # Persona ID generation
  persona_id:
    # Prefix for discovered personas
    prefix: "disc_"
    # Use hash of centroid for reproducibility
    use_centroid_hash: true
    # Hash length
    hash_length: 8

  # Demographics aggregation
  demographics:
    # Fields to aggregate from session metadata
    fields: [age_group, gender, location_type]
    # Aggregation method
    method: mode  # mode | distribution

  # Psychographics aggregation
  psychographics:
    # Compute mean OCEAN scores
    compute_ocean: true
    # Clip to valid ranges
    clip_range: [0.0, 1.0]
    # Minimum sample size for valid scores
    min_samples: 5

  # Shopping values extraction
  shopping_values:
    # Extract from top label terms
    max_values: 5
    # Term categories to prioritize
    categories: [price, quality, speed, sustainability, brand]

  # Decision heuristics mining
  decision_heuristics:
    # Mine "if X then Y" patterns from rationales
    enabled: true
    # Minimum support (fraction)
    min_support: 0.10
    # Maximum heuristics per persona
    max_heuristics: 10

  # Evaluation probes
  evaluation_probes:
    # Sample from cluster sessions
    n_samples: 5
    # Include in persona file
    include_in_file: true

  # Output
  output_dir: DATA/personas_discovered
  registry_path: DATA/personas_discovered/registry.json

# Router Configuration
router:
  # Feature flag (default: false for safe rollout)
  use_discovered_personas: false

  # Fallback behavior
  fallback:
    # Confidence threshold for assignment
    min_confidence: 0.15
    # Generic fallback persona ID
    generic_persona_id: "generic_shopper"

  # Performance
  performance:
    # Cache centroids in memory
    cache_centroids: true
    # Use FAISS for nearest neighbor
    use_faiss: true
    # Warmup on startup
    warmup_enabled: true

  # Temperature for softmax (if using mixture)
  temperature: 0.5

  # Legacy compatibility
  fallback_to_curated: true

# Report Generation
report:
  output_path: artifacts/discovery/report.md

  # Sections to include
  sections:
    - executive_summary
    - clustering_details
    - stability_analysis
    - label_quality
    - metrics_and_gates
    - cluster_table
    - merge_history
    - recommendations
    - next_steps

  # Visualizations (if enabled, requires matplotlib)
  visualizations:
    enabled: false  # Set to true if matplotlib available
    types: [embedding_2d, cluster_sizes, stability_heatmap]

  # Gate summary
  gate_summary:
    show_all: true
    fail_on_any_gate: false  # Set to true for strict gating

# Logging
logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  # Do not log prompt text or internals
  redact_prompts: true
  redact_embeddings: true
  # Log file
  log_file: artifacts/discovery/discovery.log

# Memory constraints
memory:
  # Maximum memory usage (GB)
  max_memory_gb: 4.0
  # Use memory-mapped arrays for large matrices
  use_memmap: true
  # Chunk size for batch processing
  chunk_size: 1000

# Performance benchmarks
benchmarks:
  # Baseline latency percentiles (ms)
  baseline_p50_ms: 2.0
  baseline_p95_ms: 5.0
  # Maximum allowed regression (fraction)
  max_latency_regression: 0.05  # 5%

  # Throughput test
  throughput:
    n_requests: 1000
    n_concurrent: 10
