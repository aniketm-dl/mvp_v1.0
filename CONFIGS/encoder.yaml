# Multi-view Encoder Training Configuration
# Phase 3E.2: Fused session embedding from four views

# Model architecture
model:
  # Fused embedding dimension (192-384 range)
  fused_dim: 256

  # Sequence encoder (observations + actions)
  sequence:
    vocab_size: null  # Set from dataset
    embed_dim: 128
    hidden_dim: 256
    num_layers: 2
    dropout: 0.1
    max_seq_len: 120

  # Rationale encoder
  rationale:
    vocab_size: null  # Set from dataset
    embed_dim: 64
    hidden_dim: 128
    num_layers: 1
    dropout: 0.1
    max_seq_len: 60

  # Persona MLP
  persona:
    input_dim: 12
    hidden_dims: [64, 128]
    output_dim: 128
    dropout: 0.1

  # Catalog/context encoder
  catalog:
    input_dim: 10
    hidden_dims: [32, 64]
    output_dim: 64
    dropout: 0.1

  # Fusion MLP
  fusion:
    # Input: concat of all view embeddings
    # sequence (256) + rationale (128) + persona (128) + catalog (64) = 576
    input_dim: 576
    hidden_dims: [384, 256]
    output_dim: 256  # fused_dim
    use_layer_norm: true
    dropout: 0.1

# Training objectives and loss weights
loss:
  # Next-action prediction (cross-entropy)
  next_action:
    enabled: true
    weight: 1.0
    num_actions: null  # Set from dataset

  # Contrastive alignment to persona (InfoNCE)
  persona_alignment:
    enabled: true
    weight: 0.5
    temperature: 0.07
    num_negatives: 63  # Batch size - 1

  # Rationale alignment (cosine similarity)
  rationale_alignment:
    enabled: true
    weight: 0.3

  # Psychometric regularizer (MSE to Twin-2K-500 mappings)
  psychometric:
    enabled: false  # Optional
    weight: 0.1
    target_dim: 8  # Placeholder for Twin-2K-500 mappings

# Training hyperparameters
training:
  # Optimizer
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

  # Learning rate schedule
  lr_scheduler: cosine
  warmup_steps: 500
  min_lr: 1.0e-6

  # Gradient management
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

  # Mixed precision
  precision: 16-mixed  # fp16 with autocast

  # Batch and epochs
  batch_size: 64
  num_epochs: 50
  accumulate_grad_batches: 1

  # Checkpointing
  save_top_k: 3
  monitor: val/next_action_acc
  mode: max

  # Early stopping
  early_stop_patience: 10
  early_stop_min_delta: 0.001

  # Validation
  val_check_interval: 1.0  # Every epoch
  limit_val_batches: 1.0

# Data
data:
  num_workers: 4
  pin_memory: true
  persistent_workers: false

# Ablation settings
ablation:
  # Run ablations after training
  enabled: true
  ablations:
    - name: "full"
      disable_persona: false
      disable_rationale: false
    - name: "no_persona"
      disable_persona: true
      disable_rationale: false
    - name: "no_rationale"
      disable_persona: false
      disable_rationale: true
    - name: "no_alignment"
      disable_persona: true
      disable_rationale: true

# Evaluation metrics
eval:
  # Next-action prediction
  next_action_topk: [1, 3, 5]

  # Persona alignment (retrieval)
  persona_recall_k: [1, 5, 10, 20]

  # Embedding quality
  compute_embedding_stats: true

# Export
export:
  # ONNX export
  onnx:
    enabled: true
    opset_version: 14
    dynamic_axes: true

  # Embedding export
  embeddings:
    enabled: true
    format: parquet
    include_metadata: true

# Hardware
device: auto  # auto, cpu, cuda, mps
seed: 17
deterministic: true
