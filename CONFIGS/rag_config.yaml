# RAG Configuration
# Central control for retrieval-augmented generation settings
# WHY: Consistent retrieval behavior across all personas and queries

# Retrieval backend
backend:
  type: "faiss"             # faiss, chromadb, pinecone, weaviate
  index_path: "DATA/rag_index"
  persist_directory: "DATA/rag_index"

  # FAISS-specific settings
  faiss:
    index_type: "IndexFlatL2"  # IndexFlatL2, IndexIVFFlat, IndexHNSWFlat
    metric: "L2"              # L2, cosine, dot_product
    dimension: 768            # Embedding dimension
    use_gpu: false            # GPU acceleration for FAISS

  # ChromaDB-specific settings
  chromadb:
    collection_name: "darpan_twins"
    distance_metric: "cosine"
    persist: true

  # Pinecone-specific settings
  pinecone:
    environment: "us-west1-gcp"
    index_name: "darpan-twins"
    api_key: null             # Set via environment variable

# Embedding model
embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  model_type: "sentence_transformers"  # sentence_transformers, openai, cohere
  dimension: 384              # Output embedding dimension
  normalize: true             # L2 normalize embeddings
  batch_size: 32              # Batch size for embedding generation
  device: "cpu"               # cpu, cuda
  cache_embeddings: true      # Cache computed embeddings

  # OpenAI embeddings (if using)
  openai:
    model: "text-embedding-ada-002"
    api_key: null

# Retrieval parameters
retrieval:
  # Top-k retrieval
  top_k: 5                    # Number of documents to retrieve
  min_similarity: 0.5         # Minimum similarity score threshold
  max_tokens_per_doc: 512     # Truncate documents to this length

  # Reranking
  rerank: false               # Enable reranking
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_k: 3             # Final number after reranking

  # Diversity
  mmr_enabled: false          # Maximal Marginal Relevance
  mmr_lambda: 0.5             # Balance between relevance and diversity

  # Filtering
  filter_by_metadata: false   # Enable metadata filtering
  metadata_filters: {}        # Key-value pairs for filtering

# Document processing
documents:
  # Chunking strategy
  chunk_size: 512             # Characters per chunk
  chunk_overlap: 50           # Overlap between chunks
  chunking_method: "recursive"  # recursive, fixed, sentence

  # Preprocessing
  lowercase: false            # Convert to lowercase
  remove_punctuation: false
  remove_stopwords: false
  strip_whitespace: true

  # Document metadata
  include_metadata: true
  metadata_fields: ["source", "twin_id", "timestamp", "task"]

# Query processing
query:
  # Query expansion
  expand_query: false         # Expand query with synonyms/related terms
  expansion_method: "llm"     # llm, wordnet, none

  # Query rewriting
  rewrite_query: false        # Rewrite ambiguous queries
  rewrite_model: null         # Model for rewriting

  # Preprocessing
  lowercase: false
  remove_stopwords: false
  strip_whitespace: true

  # Hybrid search
  hybrid_search: false        # Combine dense and sparse retrieval
  hybrid_alpha: 0.5           # Weight for dense vs sparse (0=sparse, 1=dense)

# Context assembly
context:
  # How to assemble retrieved documents into prompt
  format: "concat"            # concat, template, structured
  separator: "\n\n---\n\n"    # Separator between documents
  max_context_length: 2048    # Maximum total context length
  prepend_query: true         # Include original query in context
  include_sources: true       # Include document sources in response

  # Template for formatting (if format=template)
  template: |
    Context:
    {documents}

    Query: {query}

    Answer based on the context above:

# Caching
caching:
  enabled: true
  cache_retrievals: true      # Cache retrieval results
  cache_embeddings: true      # Cache query embeddings
  ttl_seconds: 3600           # 1 hour cache lifetime
  cache_backend: "memory"     # memory, redis, disk

# Persona-specific RAG settings
persona_overrides:
  # Research-oriented personas retrieve more docs
  detailed:
    twin_ids: ["research_oriented", "comparison_shopper", "methodical_researcher"]
    top_k: 10
    max_context_length: 3072

  # Impulse buyers retrieve fewer, prioritize speed
  quick:
    twin_ids: ["impulse_buyer", "mobile_shopper"]
    top_k: 3
    max_context_length: 1024

  # Standard for others
  standard:
    twin_ids: []
    top_k: 5
    max_context_length: 2048

# Index building and maintenance
index:
  # Building
  auto_build: false           # Build index automatically on startup
  rebuild_if_missing: true    # Rebuild if index not found
  incremental_updates: true   # Support adding documents incrementally

  # Maintenance
  auto_optimize: false        # Periodically optimize index
  optimize_frequency_hours: 24

  # Data sources for index
  data_sources:
    - type: "persona_cards"
      path: "DATA/personas.json"
      enabled: true
    - type: "twin_decisions"
      path: "DATA/twin_bank.json"
      enabled: true
    - type: "sft_data"
      path: "DATA/sft"
      enabled: false

# Quality and validation
quality:
  # Retrieval quality
  check_relevance: true       # Validate retrieved docs are relevant
  min_relevance_score: 0.3

  # Embedding quality
  check_embedding_quality: true
  detect_outliers: true       # Flag unusual embeddings

  # Monitoring
  log_retrievals: true        # Log all retrieval operations
  track_hit_rate: true        # Track cache hit rate

# Performance optimization
performance:
  # Batching
  batch_queries: false        # Batch multiple queries together
  batch_size: 10

  # Concurrency
  max_concurrent_retrievals: 5

  # Index loading
  lazy_load_index: false      # Load index on first use
  preload_embeddings: true    # Preload common embeddings

# Fallback behavior
fallback:
  # If retrieval fails or returns empty
  use_fallback: true
  fallback_strategy: "empty"  # empty, default_context, error

  # Default context if no results
  default_context: "No relevant context found."

# Monitoring and logging
monitoring:
  log_queries: true
  log_retrievals: true
  log_embeddings: false       # Verbose, usually off
  track_latency: true
  track_token_usage: true

  # Metrics to track
  metrics:
    - "retrieval_latency_ms"
    - "embedding_latency_ms"
    - "num_docs_retrieved"
    - "avg_similarity_score"
    - "cache_hit_rate"

# Integration with twins
twin_integration:
  # RAG for chat
  use_rag_for_chat: true
  chat_retrieval_mode: "context_only"  # context_only, augmented_generation

  # RAG for decisions
  use_rag_for_decisions: false  # Decisions use visible candidates only

  # RAG for explanations
  use_rag_for_explain: true
  explain_retrieval_mode: "augmented_generation"

# Experimental features
experimental:
  # Self-reflection retrieval
  self_query: false           # Model generates its own retrieval queries

  # Multi-hop retrieval
  multi_hop: false            # Retrieve, then retrieve again based on results
  max_hops: 2

  # Hypothetical document embeddings (HyDE)
  hyde_enabled: false         # Generate hypothetical doc, embed it, retrieve

# Version and metadata
metadata:
  version: "1.0"
  last_updated: "2025-10-15"
  owner: "darpan-labs"
  purpose: "Central RAG config for context retrieval"
  phase: "1-config-centralization"

  # Notes
  notes: |
    RAG is primarily for chat and explain modes.
    Decisions use only visible candidates (no RAG expansion).
    Context must be grounded in page-visible items per spec.
