# OPeRA (Observation-Persona-Rationale-Action) Dataset Configuration
# Phase 3E.1: Parser and dataloader settings

# Data paths
paths:
  raw_dir: "DATA/OPeRA/raw"
  processed_dir: "DATA/OPeRA/processed"
  train_split: "DATA/OPeRA/processed/train"
  val_split: "DATA/OPeRA/processed/val"
  test_split: "DATA/OPeRA/processed/test"

# Input format
input:
  format: "jsonl"  # json, jsonl, or csv
  encoding: "utf-8"

# Token budgets (enforced during parsing)
token_limits:
  observation_max: 120
  rationale_max: 60
  action_max: 20
  context_max: 80

# HTML normalization
html_processing:
  keep_semantic_tags: true
  semantic_tags: ["strong", "em", "b", "i", "mark", "del", "ins"]
  strip_scripts: true
  strip_styles: true
  normalize_whitespace: true
  max_text_length: 500

# Persona embedding dimensions
persona:
  ocean_dim: 5
  psychographic_dim: 4
  demographic_dim: 3
  total_dim: 12

# Dataset splits (stratified by user_id)
splits:
  train: 0.7
  val: 0.15
  test: 0.15
  min_sessions_per_user: 2
  random_seed: 17

# Quality filters
quality:
  min_observation_length: 10
  min_action_length: 1
  max_steps_per_session: 100
  allow_null_rationale: true
  require_valid_action: true

# Action vocabulary
actions:
  allowed_types:
    - "click"
    - "add_to_cart"
    - "purchase"
    - "view"
    - "search"
    - "filter"
    - "sort"
    - "compare"
    - "save"
    - "share"

# Output format
output:
  format: "parquet"
  compression: "snappy"
  row_group_size: 10000

# Alignment requirements (OPeRA paper constraints)
alignment:
  require_observation_per_step: true
  require_action_per_step: true
  allow_missing_rationale: true
  allow_missing_persona: false

# Determinism
deterministic: true
seed: 17
