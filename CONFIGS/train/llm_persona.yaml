train:
  base_model: "HuggingFaceTB/SmolLM2-360M-Instruct"
  adapter_dir: "artifacts/llm_adapters"
  per_device_train_batch_size: 8
  learning_rate: 2e-4
  num_train_epochs: 1
  seed: 17
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  max_new_tokens: 48
  gradient_accumulation_steps: 1
  use_8bit: false
