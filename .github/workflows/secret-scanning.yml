name: Secret Scanning

on:
  push:
    branches: [ main, mvp_ryanair, develop ]
  pull_request:
    branches: [ main, mvp_ryanair, develop ]
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  gitleaks:
    name: Scan for Secrets with Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the workflow on gitleaks issues
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for Gitleaks Pro
        continue-on-error: true  # Allow false positives

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  trufflehog:
    name: Scan for Secrets with TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: always()
    steps:
      - name: Security scan completed
        run: |
          echo "🔍 Security scanning completed"
          echo ""
          echo "📊 Results:"
          echo "  - Gitleaks: ${{ needs.gitleaks.result }} (may have false positives in docs)"
          echo "  - TruffleHog: ${{ needs.trufflehog.result }} (verified secrets only)"
          echo ""

          # Only fail on TruffleHog failures (verified secrets)
          if [ "${{ needs.trufflehog.result }}" == "failure" ]; then
            echo "❌ VERIFIED SECRETS DETECTED by TruffleHog!"
            echo "⚠️  These are confirmed secrets that must be removed immediately."
            exit 1
          else
            echo "✅ No verified secrets detected"

            # Warn about Gitleaks but don't fail
            if [ "${{ needs.gitleaks.result }}" == "failure" ]; then
              echo "⚠️  Note: Gitleaks detected potential secrets (likely documentation placeholders)"
              echo "   Review the Gitleaks job logs if concerned"
            fi
          fi
