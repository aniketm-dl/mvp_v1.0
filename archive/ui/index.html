<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Darpan What-If Playground</title>
    <style>
      body { margin:0; font-family: ui-sans-serif, system-ui, Arial; color:#111; }
      .app { display:grid; grid-template-columns: 260px 1fr 400px; grid-template-rows: auto 1fr; height:100vh; }
      header { grid-column: 1/4; padding:12px 16px; border-bottom:1px solid #eee; display:flex; gap:12px; align-items:center; }
      aside { border-right:1px solid #eee; overflow:auto; }
      main { display:grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .panel { padding:12px; overflow:auto; border-bottom:1px solid #f1f1f1; }
      .right { border-left:1px solid #eee; padding:12px; overflow:auto; }
      .btn { padding:8px 12px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; }
      .btn.primary { background:#0ea5e9; color:white; border-color:#0ea5e9; }
      .row { display:flex; gap:8px; align-items:center; }
      .col { display:flex; flex-direction:column; gap:6px; }
      .list { display:flex; flex-direction:column; gap:6px; padding:8px; }
      .item { padding:8px; border:1px solid #eee; border-radius:6px; cursor:pointer; }
      .item.active { border-color:#0ea5e9; background:#f0f9ff; }
      input, select, textarea { padding:8px; border:1px solid #ddd; border-radius:6px; width:100%; }
      code, pre { background:#f8f8f8; padding:8px; border-radius:6px; }
      .tag { font-size:12px; padding:2px 6px; border:1px solid #ddd; border-radius:4px; }
      .small { font-size:12px; color:#555; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
