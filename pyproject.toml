[project]
name = "opa-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "pytorch-lightning",
  "hydra-core",
  "polars",
  "duckdb",
  "faiss-cpu",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "scikit-learn",
  "numpy",
  "pandas",
  "pyyaml",
  "typer",
  "rich",
  "pytest",
  "httpx",
  "transformers>=4.42.0",
  "peft>=0.10.0",
  "accelerate>=0.30.0",
  "datasets>=2.20.0",
  "hdbscan>=0.8.33",
  "igraph>=0.11.0",
  "leidenalg>=0.10.0",
  "pyarrow>=14.0.0",
  "umap-learn>=0.5.5",
  "tqdm>=4.66.0",
  "sentence-transformers>=2.7.0",
  "streamlit>=1.32.0",
  "plotly>=5.20.0",
  "beautifulsoup4>=4.12.0",
  "scipy>=1.11.0"
]

[tool.black]
line-length = 100

[tool.ruff]
select = ["E","F","I","B","UP","N","ANN"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["TESTS", "data"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
