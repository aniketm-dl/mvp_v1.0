[project]
name = "opa-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "scipy>=1.11.0",
  "scikit-learn",
  "pyarrow>=14.0.0",
  "pydantic>=2",
  "sentence-transformers>=2.7.0",
  "umap-learn>=0.5.5",
  "hdbscan>=0.8.33",
  "tqdm>=4.66.0",
  "rich",
  "huggingface-hub>=0.23.0",
  "datasets>=2.20.0",
  "pyyaml",
  "beautifulsoup4>=4.12.0",
  "plotly>=5.20.0",
  "streamlit>=1.32.0",
  "openai>=1.0.0",
  "pytest"
]

[tool.black]
line-length = 100

[tool.ruff]
select = ["E","F","I","B","UP","N","ANN"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["TESTS", "data"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
