target_personas:
  # mode: "use_personas_json" | "discover_from_opera"
  mode: "use_personas_json"
  # when discover_from_opera: include all tag-groups with >= min_rows
  min_rows_per_persona: 200
  max_personas: 24
sft:
  out_dir: "DATA/sft"
  per_twin_cap: 2000
train:
  cfg_file: "CONFIGS/train/llm_persona.yaml"
  # train one-by-one to keep memory bounded; set >1 to parallelize externally if desired
  concurrency: 1
runtime_after_train:
  set_use_stub_false: true
  reload_all_adapters: true
verify:
  chat_prompt: "What do you value when shopping?"
  max_check: 5
